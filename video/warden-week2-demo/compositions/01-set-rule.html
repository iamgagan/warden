<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute; inset: 0;
          background: #f5f5f4;
          font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
          overflow: hidden;
          opacity: 0;
        }
        .frame {
          position: absolute;
          left: 210px; top: 80px;
          width: 1500px; height: 800px;
          background: #fff;
          border: 1px solid #e5e5e5;
          border-radius: 14px;
          overflow: hidden;
        }
        .frame img {
          position: absolute; inset: 0;
          width: 100%; height: 100%;
          object-fit: cover; object-position: top center;
          transform-origin: center top;
        }
        .caption {
          position: absolute;
          left: 0; right: 0; top: 918px;
          text-align: center;
          font-size: 46px;
          font-weight: 700;
          letter-spacing: -0.5px;
          color: #1a1a1a;
        }
      </style>
      <div id="root" data-composition-id="set-rule" data-width="1920" data-height="1080" data-duration="8.7">
        <div class="frame">
          <img id="setrule-img" src="public/screenshots/scene-01-policy-filled.png" alt="" />
        </div>
        <div class="caption" id="setrule-caption">Set the budget. Approve the merchant.</div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0);
        tl.fromTo("#setrule-caption", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.3);
        tl.to("#setrule-img", { scale: 1.035, duration: 8.7, ease: "none" }, 0);
        tl.to("#root", { opacity: 0, duration: 0.7, ease: "power2.in" }, 8.0);
        window.__timelines["set-rule"] = tl;
      </script>
    </template>
