<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root {
          position: absolute; inset: 0;
          background: #f5f5f4;
          font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .wordmark {
          font-size: 96px;
          font-weight: 700;
          letter-spacing: -1.5px;
          color: #1a1a1a;
        }
        .tagline {
          margin-top: 18px;
          font-size: 32px;
          color: #888;
        }
      </style>
      <div id="root" data-composition-id="close" data-width="1920" data-height="1080" data-duration="3.7">
        <div class="wordmark" id="close-word">Warden</div>
        <div class="tagline" id="close-tag">every dollar, with the why</div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, 0);
        tl.fromTo("#close-word", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.2);
        tl.fromTo("#close-tag", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6);
        window.__timelines["close"] = tl;
      </script>
    </template>
  </body>
</html>
