<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Warden — Week 2/3 Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #f5f5f4; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f5f5f4;
      }
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="60"
    >
      <div id="el-hook" class="clip" data-composition-id="hook" data-composition-src="compositions/00-hook.html"
           data-width="1920" data-height="1080" data-start="0" data-duration="6.7" data-track-index="1"></div>

      <div id="el-set-rule" class="clip" data-composition-id="set-rule" data-composition-src="compositions/01-set-rule.html"
           data-width="1920" data-height="1080" data-start="5.3" data-duration="8.7" data-track-index="2"></div>

      <div id="el-saved" class="clip" data-composition-id="saved" data-composition-src="compositions/02-saved.html"
           data-width="1920" data-height="1080" data-start="13.3" data-duration="5.7" data-track-index="1"></div>

      <div id="el-enforcement" class="clip" data-composition-id="enforcement" data-composition-src="compositions/03-enforcement.html"
           data-width="1920" data-height="1080" data-start="18.3" data-duration="16.7" data-track-index="2"></div>

      <div id="el-receipt" class="clip" data-composition-id="receipt" data-composition-src="compositions/04-receipt.html"
           data-width="1920" data-height="1080" data-start="34.3" data-duration="12.7" data-track-index="1"></div>

      <div id="el-multirail" class="clip" data-composition-id="multirail" data-composition-src="compositions/05-multirail.html"
           data-width="1920" data-height="1080" data-start="46.3" data-duration="10.7" data-track-index="2"></div>

      <div id="el-close" class="clip" data-composition-id="close" data-composition-src="compositions/06-close.html"
           data-width="1920" data-height="1080" data-start="56.3" data-duration="3.7" data-track-index="1"></div>

      <!-- Voiceover: continuous audio at the root so it survives scene cuts. -->
      <audio id="el-vo" src="voiceover-with-music.mp3" data-start="0" data-duration="60" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
